alerts:
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 5
    type: symptom-based
    owner: SRE Team
    runbook: docs/alerts.md#high-error-rate
  - name: HighLatency
    severity: warning
    condition: latency_p95_ms > 4000
    type: symptom-based
    owner: SRE Team
    runbook: docs/alerts.md#high-latency
  - name: LowQualityScore
    severity: warning
    condition: quality_score_avg < 0.6
    type: symptom-based
    owner: AI Engineer
    runbook: docs/alerts.md#low-quality-score
