alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95 > 3000ms for 5 minutes
    type: symptom-based
    owner: SRE Team
    runbook: docs/alerts.md#high_latency_p95
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 5 for 3 minutes
    type: symptom-based
    owner: SRE Team
    runbook: docs/alerts.md#elevated_error_rate
  - name: cost_budget_exceeded
    severity: warning
    condition: daily_cost_usd > 2.5
    type: symptom-based
    owner: SRE Team
    runbook: docs/alerts.md#cost_budget_exceeded
